<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#243d35"><meta name="description" content="欢迎入职明天一定有限公司。你的唯一任务：今天下班。"><title>明天一定有限公司 · 下班逃脱</title><style>
:root{--paper:#f3f0e6;--ink:#243d35;--muted:#69736b;--orange:#e86e3a;--line:#cccfc1}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;background-image:radial-gradient(#243d3514 .7px,transparent .7px);background-size:7px 7px}button,input{font:inherit}button,a,input{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:4px}header{max-width:1220px;margin:auto;padding:30px 40px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{color:var(--ink);text-decoration:none;font-weight:900;font-size:22px;letter-spacing:3px}.brand span{color:var(--orange)}.brand small{display:block;font-size:8px;letter-spacing:2px;margin-top:6px}.badge{font-size:11px;color:var(--muted)}main{max-width:1100px;margin:0 auto;min-height:calc(100vh - 190px);padding:50px 40px}footer{max-width:1220px;margin:auto;padding:22px 40px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;font-size:10px;color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;font-weight:700}.eyebrow::before{content:' ';display:inline-block;width:8px;height:8px;background:var(--orange);margin-right:10px}h1{font-size:clamp(44px,6vw,76px);line-height:1.18;letter-spacing:-3px;margin:25px 0}h1 em{font-style:normal;color:var(--orange)}p{line-height:1.9}.lead{font-size:15px;color:var(--muted);max-width:440px}.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:70px;align-items:center}.primary{border:0;background:var(--ink);color:#fff;padding:17px 25px;display:inline-flex;gap:40px;align-items:center;margin-top:20px;font-weight:700;transition:transform .15s,background .15s}.primary:hover{background:#35564b;transform:translateY(-2px)}.tiny{font-size:11px;color:var(--muted);margin-top:15px}.paper{background:#fffdf6;border:1px solid #d7d5c9;padding:32px;box-shadow:10px 12px 0 #243d350b;position:relative}.hero .paper{transform:rotate(3deg);margin:30px 0}.paper:before{content:'';position:absolute;top:-14px;left:38%;height:28px;width:100px;background:#d8cdaaa6;transform:rotate(-7deg)}.dochead{font-size:10px;letter-spacing:3px;border-bottom:2px solid var(--ink);padding-bottom:15px}.paper h2{font-size:25px;margin:28px 0}.field{padding:13px 0;border-bottom:1px dashed var(--line);font-size:13px;display:flex;justify-content:space-between;gap:16px}.field span{color:var(--muted)}.stamp{border:3px double var(--orange);color:var(--orange);font-weight:900;display:inline-block;padding:10px 13px;transform:rotate(-12deg);font-size:21px;position:relative;margin-top:25px}.notes{border-top:1px solid var(--line);margin-top:55px;padding-top:22px;display:flex;gap:35px;font-size:11px;color:var(--muted)}.notes strong{color:var(--ink);display:block;font-size:16px;margin-bottom:6px}.gamehead{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:30px}.steps{display:flex;gap:8px}.step{font-size:11px;border:1px solid var(--line);padding:8px 12px;color:var(--muted)}.step.active{background:var(--ink);color:white;border-color:var(--ink)}.step.done{border-color:var(--ink);color:var(--ink)}.layout{display:grid;grid-template-columns:1fr 310px;gap:34px;align-items:start}.title{font-size:36px;letter-spacing:-1px;margin:15px 0}.sub{color:var(--muted);font-size:13px;line-height:1.9}.board{border:1px solid var(--line);background:#fffdf6;margin-top:24px;padding:26px}.option{width:100%;text-align:left;border:1px solid var(--line);background:transparent;color:var(--ink);padding:15px 18px;margin:7px 0;display:flex;justify-content:space-between;gap:16px;line-height:1.6;font-size:13px}.option:hover{background:#eef0e6;border-color:var(--ink)}.option.selected{background:var(--ink);color:white}.aside{background:#e7e9df;padding:25px;font-size:12px;line-height:1.9;border-top:3px solid var(--ink)}.aside h3{font-size:13px;margin:0 0 14px}.aside .symbol{font-size:38px;line-height:1;margin-bottom:20px}.quiet{border:0;background:none;color:var(--muted);text-decoration:underline;padding:10px 0;font-size:11px}.feedback{margin-top:18px;border-left:3px solid var(--orange);padding:12px 15px;background:#f4e6d8;font-size:13px;line-height:1.8;min-height:48px}.feedback:empty{display:none}.clue{font-family:monospace;letter-spacing:3px;font-size:20px}.inputrow{display:flex;gap:10px;margin-top:20px}.inputrow input{min-width:0;width:100%;padding:15px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:22px;letter-spacing:8px}.inputrow .primary{margin:0;gap:10px}.order{list-style:none;padding:0}.order li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line);font-size:13px}.order .num{font-family:monospace;font-size:16px;color:var(--orange)}.order .text{flex:1}.move{background:transparent;border:1px solid var(--line);padding:5px 9px;color:var(--ink)}.move:disabled{opacity:.25;cursor:default}.success{border:1px solid var(--ink);padding:24px;background:#e7ecdf;margin-top:20px}.success h3{margin:0 0 8px}.end{max-width:650px;margin:0 auto;text-align:center}.end .paper{text-align:left;margin-top:30px}.end h1{font-size:55px}.end .stamp{position:absolute;right:20px;bottom:20px}.receipt{font-family:monospace;font-size:12px;color:var(--muted)}.fade{animation:appear .35s ease-out}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(max-width:760px){header{padding:22px}.badge{display:none}main{padding:30px 22px}.hero,.layout{grid-template-columns:1fr;gap:28px}.hero .paper{margin:15px 12px}.hero h1{font-size:54px}.notes{margin-top:35px;gap:25px}.aside{order:2}.gamehead{align-items:start;flex-direction:column}.step{padding:7px 9px;font-size:10px}.title{font-size:30px}.board{padding:20px}footer{padding:20px 22px;flex-direction:column;gap:8px}.end h1{font-size:44px}.end .paper{padding:24px}.end .stamp{font-size:16px;position:relative;right:auto;bottom:auto}.inputrow .primary{padding:12px}.brand{font-size:19px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><link rel="stylesheet" href="../site.css"><script>try{if(sessionStorage.getItem("harry-entry")!=="yes")location.replace("../");}catch{location.replace("../");}</script></head>
<body><header class="site-header"><a href="../" class="site-home">← 返回主页<span> / Harry</span></a><nav class="site-nav" aria-label="内容分类"><a href="../#games">小游戏</a><a href="../#guides">游戏攻略</a><a href="../#math">数学</a></nav></header><main id="app"></main><footer><span>明天一定有限公司 © 永远的明天</span><span>本游戏没有绩效考核。现实已经够多了。</span></footer><script>const app=document.querySelector('#app');
let stage=0,started=0,mistakes=0,hints=0,solved=false,sequence=['选一个配色','写一行能跑的内容','研究最完美的工具','打开空白文件'];
const correct=['打开空白文件','写一行能跑的内容','选一个配色','研究最完美的工具'];
const labels=['找回时间','停止准备','批准下班'];
function render(html){app.innerHTML='<div class="fade">'+html+'</div>';window.scrollTo(0,0)}
function home(){render(`<section class="hero"><div><div class="eyebrow">一场并不严肃的办公室逃脱</div><h1>你今天，<br>能<em>下班</em>吗？</h1><p class="lead">欢迎入职「明天一定有限公司」。<br>这里的每个人都很忙，至于在忙什么——<br>建议不要细问，容易开会。</p><button class="primary" onclick="start()">开始办理下班手续 <span>↗</span></button><p class="tiny">约 5 分钟 · 3 道谜题 · 含微量人身吐槽</p></div><div class="paper"><div class="dochead">内部文件 / 仅供本人崩溃时阅读</div><h2>员工离场申请表</h2><div class="field"><span>员工姓名</span><b>就是你</b></div><div class="field"><span>当前职位</span><b>首席准备开始官</b></div><div class="field"><span>核心技能</span><b>把五分钟过成一个下午</b></div><div class="field"><span>申请理由</span><b>今天已经很努力地想努力了</b></div><div class="stamp">尚 未 批 准</div><p class="tiny">备注：公司大门未锁，锁住你的是流程。</p></div></section><div class="notes"><div><strong>01 — 找线索</strong>眼睛比工作群有用</div><div><strong>02 — 解考核</strong>提示随时可用</div><div><strong>03 — 真下班</strong>不接受“再弄一下”</div></div>`)}
function start(){stage=1;started=Date.now();mistakes=0;hints=0;solved=false;sequence=['选一个配色','写一行能跑的内容','研究最完美的工具','打开空白文件'];game()}
function frame(title,desc,body,aside){return `<div class="gamehead"><div class="eyebrow">离场审批 / 第 ${stage} 关</div><div class="steps">${labels.map((x,i)=>`<span class="step ${stage===i+1?'active':stage>i+1?'done':''}">${stage>i+1?'✓':String(i+1).padStart(2,'0')} ${x}</span>`).join('')}</div></div><div class="layout"><section><h2 class="title">${title}</h2><p class="sub">${desc}</p><div class="board">${body}<div id="feedback" class="feedback" role="status" aria-live="polite"></div><div id="success"></div></div><button class="quiet" onclick="hint()">请求一点不太体面的帮助 ↗</button></section><aside class="aside"><div class="symbol">✳</div><h3>来自行政部的温馨废话</h3>${aside}<hr><p>背包：${stage>1?'被找回的时间 ✓':'空空如也，像你的周计划'}${stage>2?'<br>勉强启动的行动力 ✓':''}</p><p>本次提示：<span id="hintcount">${hints}</span> 次</p></aside></div>`}
function game(){solved=false;if(stage===1){render(frame('你的五分钟，失踪了。','门禁需要三位数密码。桌上有一份浏览记录，以及一张被咖啡浸过的便利贴。',`<div class="dochead">证物 A / 今日浏览记录</div><div class="field"><span>08:50 — 09:10</span><b>如何高效开始一天</b></div><div class="field"><span>09:10 — 09:45</span><b>最适合高效人士的桌搭</b></div><div class="field"><span>09:45 — 10:30</span><b>五分钟，真的最后五分钟</b></div><p class="sub">便利贴：<br>“按时间顺序，取每段时长的<b>十位数字</b>。<br>别取时间点。公司暂时还没那么缺德。”</p><form class="inputrow" onsubmit="event.preventDefault();checkCode()"><input id="code" aria-label="三位数门禁密码" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="···"><button class="primary" type="submit">开门 ↗</button></form>`,`<p>系统显示你刚才只是“看了五分钟”。</p><p>系统也显示，你的五分钟有独立的时区。</p>`))}else if(stage===2){render(frame('你已经准备好准备了。','启动机被四项“前置工作”堵住了。按以下规则，用箭头重新排列执行顺序。',`<div class="dochead">证物 B / 启动机操作规程</div><p class="sub">① 先打开文件，再写能跑的内容。<br>② 有了能跑的内容，才允许选配色。<br>③ 工具研究排在所有事情最后。</p><ol class="order" id="order"></ol><button class="primary" onclick="checkOrder()">启动这台破机器 ↗</button>`,`<p>你已经收集了 17 个入门教程、8 款工具和 3 种笔记系统。</p><p>唯一没有入门的，是门。</p>`));drawOrder()}else{render(frame('谁有权批准你下班？','你终于拿到了最后一份审批单。仔细阅读条款，找出唯一符合规定的离场方式。',`<div class="dochead">证物 C / 员工离场条例（罕见人话版）</div><p class="sub">第 1 条：完成前两项考核，即具备离场资格。<br>第 2 条：申请人可以自行批准，无需新增任务。<br>第 3 条：禁止以等待消息或等待明天为由延期。</p><button class="option" onclick="choose(0)">A. 等老板回复“嗯”<span>↗</span></button><button class="option" onclick="choose(1)">B. 再做一版更漂亮的申请单<span>↗</span></button><button class="option" onclick="choose(2)">C. 由我本人批准，现在离场<span>↗</span></button><button class="option" onclick="choose(3)">D. 明天一定下班<span>↗</span></button>`,`<p>审批单已转发给了你。</p><p>你正在等待你的回复。</p><p>如果你也不回复你，你们俩就很难推进。</p>`))}}
function feedback(text){document.querySelector('#feedback').textContent=text}
function win(text){if(solved)return;solved=true;document.querySelectorAll('.board button,.board input').forEach(b=>b.disabled=true);document.querySelector('#success').innerHTML=`<div class="success"><h3>✓ 审批通过</h3><p>${text}</p><button class="primary" onclick="next()">${stage===3?'领取下班证明':'去下一道离谱流程'} ↗</button></div>`;document.querySelector('#feedback').textContent=''}
function checkCode(){if(solved)return;const value=document.querySelector('#code').value.trim();if(value==='234')win('时间找回来了。虽然找回来也不退给你，但至少我们知道它去哪了。');else{mistakes++;feedback(/^\d{3}$/.test(value)?'密码不对。请计算三段各用了多少分钟，再取十位。你可以算，公司又没禁止你聪明。':'需要三个数字。门禁不接受“我觉得应该可以”。')}}
function drawOrder(){document.querySelector('#order').innerHTML=sequence.map((x,i)=>`<li><span class="num">0${i+1}</span><span class="text">${x}</span><button class="move" aria-label="上移：${x}" onclick="move(${i},-1)" ${i===0?'disabled':''}>↑</button><button class="move" aria-label="下移：${x}" onclick="move(${i},1)" ${i===3?'disabled':''}>↓</button></li>`).join('')}
function move(i,delta){if(solved)return;const j=i+delta;if(j<0||j>3)return;[sequence[i],sequence[j]]=[sequence[j],sequence[i]];drawOrder();const row=document.querySelectorAll('#order li')[j];row.querySelector(delta<0&&j>0?'button:first-of-type':j<3?'button:last-of-type':'button:first-of-type').focus()}
function checkOrder(){if(solved)return;if(sequence.every((x,i)=>x===correct[i]))win('启动成功。原来“开始”这件事，不需要先买一个新键盘。');else{mistakes++;feedback('机器拒绝启动。请按三条规程检查顺序；审美和工具都得给实际动手让个位。')}}
function choose(i){if(solved)return;if(i===2)win('已收到你的批准。没有反转，你真的可以走了。');else{mistakes++;feedback(['第 3 条写着不能等消息。老板的“嗯”还在量子叠加态。','第 2 条禁止新增任务。你这个人连逃跑都想先做个封面。','','第 3 条禁止等明天。公司名是讽刺，你还真当企业文化了。'][i])}}
function hint(){if(solved){feedback('你已经通过了。再找提示，多少有点不舍得下班了。');return}hints++;document.querySelector('#hintcount').textContent=hints;feedback(['','三段时长分别是 20、35、45 分钟。密码是它们的十位数字。','顺序：打开空白文件 → 写一行能跑的内容 → 选一个配色 → 研究最完美的工具。','前两关已经通过。第 2 条说，你自己就能批准。选 C。'][stage])}
function next(){stage++;if(stage<=3)game();else ending()}
function ending(){const sec=Math.max(1,Math.floor((Date.now()-started)/1000)),time=`${Math.floor(sec/60)} 分 ${sec%60} 秒`;render(`<section class="end"><div class="eyebrow">离场审批完成 / 今天就到这里</div><h1>批准了。<br><em>现在，去玩吧。</em></h1><p class="sub">恭喜，你成功从一套本来就不该存在的流程里逃了出来。<br>这可能是你今天最像上班的一次娱乐。</p><div class="paper"><div class="dochead">正式证明 / 盖章后不许反悔</div><h2>今日下班许可证</h2><div class="field"><span>持证人</span><b>就是你，本人批准</b></div><div class="field"><span>办理耗时</span><b>${time}</b></div><div class="field"><span>试错 / 求助</span><b>${mistakes} 次 / ${hints} 次</b></div><div class="field"><span>人事评语</span><b>${hints>2?'懂得求助，适合当领导':mistakes>3?'流程虽曲折，下班很坚定':'有点聪明，建议用于正事'}</b></div><p class="sub">今天不必把所有事都弄明白。<br>能开始一件小事，也能允许自己停下来。</p><div class="stamp">即 刻 生 效</div></div><button class="primary" onclick="start()">再入职一次 ↻</button><p class="tiny">重复入职不会发双倍工资。别试探。</p></section>`)}
home();
</script></body></html>
